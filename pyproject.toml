[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viragraph"
version = "0.1.0"
description = "Viral quasispecies and sequence-variation graph research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ViraGraph contributors"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[project.scripts]
viragraph = "viragraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
